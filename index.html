<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine Learning Lab</title>
<meta name="description" content="Write Python and check it instantly. Statistics, regression, decision trees and classifier metrics, all running in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.43.3/src-min-noconflict/ace.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.43.3/src-min-noconflict/mode-python.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.43.3/src-min-noconflict/mode-text.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.43.3/src-min-noconflict/theme-tomorrow_night.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.43.3/src-min-noconflict/theme-chrome.js"></script>
<style>
:root {
  --bg: #f6f6f3; --card: #ffffff; --ink: #1c1d1a; --muted: #6a6c63; --line: #dcdcd4;
  --accent: #3f7d1e; --accent-ink: #ffffff; --ok: #2f7d32; --bad: #b3261e; --warn: #8a6100;
  --code-bg: #efefe9; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14150f; --card: #1b1c16; --ink: #e8e6dc; --muted: #9a988c; --line: #34352c;
    --accent: #7cc242; --accent-ink: #10210a; --ok: #7cc242; --bad: #ee7b6c; --warn: #f0b90b;
    --code-bg: #101109;
  }
}
:root[data-theme="dark"] {
  --bg: #14150f; --card: #1b1c16; --ink: #e8e6dc; --muted: #9a988c; --line: #34352c;
  --accent: #7cc242; --accent-ink: #10210a; --ok: #7cc242; --bad: #ee7b6c; --warn: #f0b90b;
  --code-bg: #101109;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--sans); }
button { font: inherit; cursor: pointer; }
code { font: 12.5px var(--mono); background: var(--code-bg); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }

/* top bar */
.top { display: flex; align-items: center; gap: 20px; padding: 0 18px; height: 48px; border-bottom: 1px solid var(--line); background: var(--card); }
.brand { font-weight: 600; letter-spacing: .01em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 8px; }
.meter { display: flex; align-items: center; gap: 10px; margin-left: auto; color: var(--muted); font: 12px var(--mono); }
.meter .bar { width: 120px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 4px 6px; }
.linkbtn:hover { color: var(--ink); }

/* layout */
.app { display: grid; grid-template-columns: 232px minmax(320px, 1fr) minmax(360px, 1.1fr); height: calc(100vh - 48px); }
.rail { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 0 24px; background: var(--card); }
.lesson { overflow-y: auto; padding: 22px 28px 48px; border-right: 1px solid var(--line); }
.work { display: grid; grid-template-rows: minmax(180px, 1fr) auto minmax(120px, 0.8fr); min-height: 0; }

/* rail */
.mod { padding: 12px 16px 4px; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.item { display: flex; gap: 10px; align-items: baseline; width: 100%; padding: 6px 16px; background: none; border: 0; border-left: 2px solid transparent; text-align: left; color: var(--ink); }
.item:hover { background: var(--bg); }
.item.active { border-left-color: var(--accent); background: var(--bg); }
.item .mark { width: 14px; flex: none; color: var(--muted); font: 12px var(--mono); }
.item.done .mark { color: var(--ok); }
.item .t { flex: 1; font-size: 13px; }
.item .d { font: 11px var(--mono); color: var(--muted); }

/* lesson */
.meta { font: 12px var(--mono); color: var(--muted); }
h1 { font-size: 22px; line-height: 1.25; margin: 4px 0 10px; font-weight: 600; }
.goal { font-size: 15px; margin: 0 0 18px; }
.teach p { margin: 0 0 12px; max-width: 62ch; }
.teach pre { margin: 0 0 14px; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font: 12.5px/1.6 var(--mono); }
.sect { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
.sect h2 { margin: 0 0 8px; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 4px; margin-bottom: 8px; background: var(--card); }
.pass-banner { padding: 10px 12px; border: 1px solid var(--ok); border-radius: 4px; color: var(--ok); margin-bottom: 12px; }

/* buttons: label-sized pills, one filled primary, one outline secondary */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 13px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { height: 26px; padding: 0 11px; font-size: 12px; }

/* work column */
.editor-wrap { min-height: 0; position: relative; border-bottom: 1px solid var(--line); }
#editor { position: absolute; inset: 0; font-size: 13px; }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
.toolbar .status { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
.out { overflow-y: auto; padding: 12px 14px 20px; background: var(--card); }
.out h2 { margin: 0 0 8px; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
pre.stdout { margin: 0 0 12px; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; }
.err { color: var(--bad); }
.check { display: grid; grid-template-columns: 18px 1fr; gap: 0 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check .ic { font: 13px var(--mono); }
.check.ok .ic { color: var(--ok); }
.check.no .ic { color: var(--bad); }
.check .why { grid-column: 2; font: 12px/1.5 var(--mono); color: var(--muted); margin-top: 3px; }
.check .note { grid-column: 2; margin-top: 4px; font-size: 13px; }
.empty { color: var(--muted); }

@media (max-width: 1000px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .rail { max-height: 200px; border-right: 0; border-bottom: 1px solid var(--line); }
  .lesson { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .work { grid-template-rows: 300px auto auto; }
  .meter .bar { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand">Machine Learning Lab <small id="sub"></small></div>
  <div class="meter"><span id="count"></span><span class="bar"><i id="fill"></i></span></div>
  <button class="linkbtn" id="export">Export progress</button>
  <button class="linkbtn" id="import">Import</button>
  <button class="linkbtn" id="theme">Theme</button>
  <input type="file" id="file" accept="application/json" hidden>
</header>
<div class="app">
  <nav class="rail" id="rail" aria-label="Lessons"></nav>
  <main class="lesson" id="lesson"></main>
  <section class="work">
    <div class="editor-wrap"><div id="editor"></div></div>
    <div class="toolbar">
      <button class="btn primary" id="check">Check my work</button>
      <button class="btn" id="run">Run</button>
      <button class="btn" id="reset">Reset code</button>
      <span class="status" id="status">Loading Python</span>
    </div>
    <div class="out" id="out"><span class="empty">Run or check your code to see results here. Ctrl or Cmd with Enter checks.</span></div>
  </section>
</div>
<script src="app-data.js"></script>
<script>
(() => {
  const { course, lessons, datasets, runner } = window.LAB;
  const KEY = course.storageKey;
  const byId = Object.fromEntries(lessons.map((l) => [l.id, l]));
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

  /* ---------- progress (localStorage, never required) ---------- */
  let state = { done: {}, drafts: {}, hints: {}, tries: {}, active: lessons[0].id };
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { /* private window */ }
  if (!byId[state.active]) state.active = lessons[0].id;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } };

  /* ---------- theme ---------- */
  const root = document.documentElement;
  const dark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  function applyTheme() { editor.setTheme(dark() ? "ace/theme/tomorrow_night" : "ace/theme/chrome"); }
  try { const t = localStorage.getItem(KEY + "-theme"); if (t) root.dataset.theme = t; } catch (e) { /* ignore */ }
  $("theme").onclick = () => {
    root.dataset.theme = dark() ? "light" : "dark";
    try { localStorage.setItem(KEY + "-theme", root.dataset.theme); } catch (e) { /* ignore */ }
    applyTheme();
  };

  /* ---------- editor ---------- */
  const editor = ace.edit("editor", { fontFamily: "JetBrains Mono, monospace", tabSize: 4, useSoftTabs: true, showPrintMargin: false, wrap: true });
  editor.session.on("change", () => { state.drafts[state.active] = editor.getValue(); save(); });
  editor.commands.addCommand({ name: "check", bindKey: { win: "Ctrl-Enter", mac: "Command-Enter" }, exec: () => doRun("check") });
  applyTheme();

  /* ---------- worker with watchdog ---------- */
  let worker, seq = 0, pending = null, ready = false;
  const LIMIT_MS = 20000;
  function spawn() {
    ready = false;
    setStatus("Loading Python");
    worker = new Worker("worker.js", { type: "module" });
    worker.onmessage = (e) => {
      const m = e.data;
      if (m.type === "status") setStatus(m.msg);
      else if (m.type === "ready") { ready = true; setStatus("Ready"); }
      else if (m.type === "running" && pending && pending.id === m.id) {
        setStatus("Running");
        pending.timer = setTimeout(() => timeout(), LIMIT_MS);
      } else if ((m.type === "result" || m.type === "fatal") && pending && pending.id === m.id) {
        clearTimeout(pending.timer);
        const p = pending; pending = null;
        setStatus("Ready");
        m.type === "result" ? p.resolve(m.result) : p.resolve({ status: "error", message: "Python failed to start: " + m.message });
      }
    };
    worker.postMessage({ type: "init", runner });
  }
  function timeout() {
    const p = pending; pending = null;
    worker.terminate();
    spawn();
    p.resolve({ status: "error", message: "The run stopped after " + LIMIT_MS / 1000 + " seconds. A loop that never ends is the usual cause. Check the loop's stop condition." });
  }
  function call(type, lesson, code) {
    return new Promise((resolve) => {
      const id = ++seq;
      pending = { id, resolve, timer: null };
      const slim = { id: lesson.id, kind: lesson.kind, function: lesson.function, try: lesson.try, setup: lesson.setup, datasets: lesson.datasets, checks: lesson.checks, pitfalls: lesson.pitfalls };
      worker.postMessage({ type, id, lesson: slim, code, datasets });
    });
  }
  const setStatus = (s) => { $("status").textContent = s; };

  /* ---------- rail ---------- */
  function renderRail() {
    let html = "";
    for (const mod of course.modules) {
      html += `<div class="mod">${esc(mod.title)}</div>`;
      for (const l of lessons.filter((x) => x.module === mod.id)) {
        const done = state.done[l.id];
        html += `<button class="item ${l.id === state.active ? "active" : ""} ${done ? "done" : ""}" data-id="${l.id}">` +
          `<span class="mark">${done ? "✓" : "·"}</span><span class="t">${esc(l.title)}</span><span class="d">${l.minutes}m</span></button>`;
      }
    }
    $("rail").innerHTML = html;
    $("rail").querySelectorAll(".item").forEach((b) => (b.onclick = () => open(b.dataset.id)));
    const n = Object.keys(state.done).length;
    $("count").textContent = `${n} of ${lessons.length}`;
    $("fill").style.width = (n / lessons.length) * 100 + "%";
  }

  /* ---------- lesson ---------- */
  function renderLesson() {
    const l = byId[state.active];
    const mod = course.modules.find((m) => m.id === l.module);
    const hintsShown = state.hints[l.id] || 0;
    const tries = state.tries[l.id] || 0;
    let h = `<div class="meta">${esc(mod.title)} · ${l.id} · level ${l.difficulty} · about ${l.minutes} min</div>`;
    h += `<h1>${esc(l.title)}</h1><p class="goal">${fmt(l.goal)}</p><div class="teach">`;
    for (const b of l.teach) h += b.t === "code" ? `<pre>${esc(b.text)}</pre>` : `<p>${fmt(b.text)}</p>`;
    h += `</div><div class="sect" id="help"><h2>Help</h2>`;
    for (let i = 0; i < hintsShown; i++) h += `<div class="hint"><strong>Hint ${i + 1}.</strong> ${fmt(l.hints[i])}</div>`;
    h += `<div class="row">`;
    if (hintsShown < 2) h += `<button class="btn sm" id="hintbtn" ${tries ? "" : "disabled"} title="${tries ? "" : "Check your work once to unlock hints"}">Show hint ${hintsShown + 1}</button>`;
    if (hintsShown >= 2 && tries >= 3 && !state.done[l.id]) h += `<button class="btn sm" id="solbtn">Show a working answer</button>`;
    if (!tries) h += `<span class="meta">Hints unlock after your first check.</span>`;
    h += `</div></div>`;
    if (state.done[l.id]) {
      h += `<div class="sect"><h2>Why it works</h2><p>${fmt(l.explainer)}</p>${nextBtn()}</div>`;
    }
    $("lesson").innerHTML = h;
    $("lesson").scrollTop = 0;
    const hb = $("hintbtn"); if (hb) hb.onclick = () => { state.hints[l.id] = hintsShown + 1; save(); keepScroll(renderLesson); };
    const sb = $("solbtn");
    if (sb) sb.onclick = () => { if (confirm("Replace your code with a working answer? Your current code is kept in undo history.")) { editor.setValue(l.solution, 1); } };
    const nb = $("nextbtn"); if (nb) nb.onclick = () => nextLesson();
  }
  const keepScroll = (fn) => { const y = $("lesson").scrollTop; fn(); $("lesson").scrollTop = y; };
  function nextBtn() {
    const i = lessons.findIndex((x) => x.id === state.active);
    return i < lessons.length - 1 ? `<div class="row" style="margin-top:12px"><button class="btn primary" id="nextbtn">Next lesson</button></div>` : "";
  }
  function nextLesson() {
    const i = lessons.findIndex((x) => x.id === state.active);
    if (i < lessons.length - 1) open(lessons[i + 1].id);
  }

  function open(id) {
    state.active = id; save();
    const l = byId[id];
    editor.session.setMode(l.kind === "text" ? "ace/mode/text" : "ace/mode/python");
    editor.session.setUseWrapMode(l.kind === "text");
    editor.setValue(state.drafts[id] != null ? state.drafts[id] : l.starter, -1);
    $("run").hidden = l.kind === "text";
    $("check").textContent = l.kind === "text" ? "Check my answer" : "Check my work";
    $("out").innerHTML = '<span class="empty">Run or check your code to see results here. Ctrl or Cmd with Enter checks.</span>';
    renderRail(); renderLesson();
  }

  /* ---------- running ---------- */
  async function doRun(kind) {
    if (pending) return;
    const l = byId[state.active];
    const code = editor.getValue();
    $("check").disabled = $("run").disabled = true;
    $("out").innerHTML = '<span class="empty">Working…</span>';
    const res = await call(kind === "check" ? "check" : "run", l, code);
    $("check").disabled = $("run").disabled = false;
    let h = "";
    if (kind === "run" && res.call) h += `<h2>Sample call</h2><pre class="stdout">${esc(res.call)}</pre>`;
    if (res.stdout) h += `<h2>Printed</h2><pre class="stdout">${esc(res.stdout)}</pre>`;
    if (res.status === "error") {
      h += `<h2>Problem</h2><p class="err">${fmt(res.message || "The code did not run.")}</p>`;
      if (kind === "check") bump(l);
    } else if (kind === "run") {
      if (res.value != null) h += `<h2>Returned</h2><pre class="stdout">${esc(res.value)}</pre>`;
      else if (!res.stdout) h += '<span class="empty">Nothing ran. Defining a function does not run it. Call it yourself, for example <code>' + esc(l.function || "name") + '(...)</code>, or press Check my work.</span>';
    } else {
      const ok = res.checks.filter((c) => c.passed).length;
      h += `<h2>Checks · ${ok} of ${res.checks.length}</h2>`;
      const seenNotes = new Set();
      for (const c of res.checks) {
        h += `<div class="check ${c.passed ? "ok" : "no"}"><span class="ic">${c.passed ? "✓" : "✗"}</span><span>${esc(c.label)}</span>`;
        if (!c.passed && c.actual) h += `<div class="why">expected ${esc(c.expected)}<br>got ${esc(c.actual)}</div>`;
        if (!c.passed && c.note && !seenNotes.has(c.note)) { seenNotes.add(c.note); h += `<div class="note">${fmt(c.note)}</div>`; }
        h += `</div>`;
      }
      if (res.passed) {
        h = `<div class="pass-banner">All checks pass.</div>` + h;
        if (!state.done[l.id]) { state.done[l.id] = Date.now(); save(); renderRail(); keepScroll(renderLesson); }
      } else {
        bump(l);
        for (const n of res.notes || []) h += `<p class="note"><strong>Look at:</strong> ${fmt(n)}</p>`;
      }
    }
    $("out").innerHTML = h;
  }
  function bump(l) { state.tries[l.id] = (state.tries[l.id] || 0) + 1; save(); keepScroll(renderLesson); }

  $("check").onclick = () => doRun("check");
  $("run").onclick = () => doRun("run");
  $("reset").onclick = () => { if (confirm("Replace your code with the starter code?")) editor.setValue(byId[state.active].starter, -1); };

  /* ---------- export / import ---------- */
  $("export").onclick = () => {
    const blob = new Blob([JSON.stringify({ course: KEY, exported: new Date().toISOString(), state }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "ml-lab-progress.json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("import").onclick = () => $("file").click();
  $("file").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.course !== KEY || !data.state) throw new Error("not a progress file for this course");
      state = Object.assign({ done: {}, drafts: {}, hints: {}, tries: {}, active: lessons[0].id }, data.state);
      if (!byId[state.active]) state.active = lessons[0].id;
      save(); open(state.active);
    } catch (err) { alert("Could not import: " + err.message); }
    e.target.value = "";
  };

  $("sub").textContent = course.subtitle;
  spawn();
  open(state.active);
})();
</script>
</body>
</html>
